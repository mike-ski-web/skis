{% extends "base.html" %}{% block inhoud %}
<h1>Ski-test 2026/27</h1><p>Vind de ski die bij jou past. We beoordelen elke ski op zeven punten, met een methode die we <a href="{{ BASE }}/methode/">openbaar maken</a>.</p>
<h2>Skifinder</h2>
<div class="kaart"><div class="finder">
<label>Jouw niveau<select id="niv"><option value="">Alle</option><option value="Beginner">Beginner / gemiddeld</option><option value="Intermediate">Gemiddeld / gevorderd</option><option value="Expert">Gevorderd / expert</option></select></label>
<label>Waar ski je het meest?<select id="ter"><option value="mix">Afwisselend</option><option value="piste">Vooral op de piste</option><option value="poeder">Veel naast de piste</option></select></label>
<label>Hoe ski je?<select id="stijl"><option value="rustig">Rustig en ontspannen</option><option value="speels">Speels</option><option value="snel">Snel en strak</option></select></label>
<label>Ski voor<select id="gesl"><option value="">Iedereen</option><option value="dames">Dames</option></select></label>
</div><div id="uitslag" class="grid"></div></div>
<h2>Categorieën</h2><p><a href="{{ BASE }}/allmountain/">Allmountain-ski's 2026/27</a></p>
<h2>Merken</h2><p>{% for m in merken %}<a class="tag" href="{{ BASE }}/{{ m|lower|replace('ö','o')|replace(' ','-') }}/">{{ m }}</a> {% endfor %}</p>
<script>
const SKI={{ finder|safe }};
const W={piste:{grip:3,stabiliteit:1,drijfvermogen:-1},mix:{grip:1,drijfvermogen:1,wendbaarheid:1},poeder:{drijfvermogen:3,grip:-1},
 rustig:{vergevingsgezind:2,wendbaarheid:1},speels:{speelsheid:3,wendbaarheid:1},snel:{stabiliteit:3,grip:1,vergevingsgezind:-1}};
function upd(){const niv=document.getElementById('niv').value,ter=document.getElementById('ter').value,st=document.getElementById('stijl').value,g=document.getElementById('gesl').value;
 let l=SKI.filter(s=>(!niv||s.niv.includes(niv))&&(!g||s.g==g));
 l.forEach(s=>{s.sc=0;[W[ter],W[st]].forEach(w=>{for(const k in w)s.sc+=w[k]*(s[k]||0)})});
 l.sort((a,b)=>b.sc-a.sc);
 document.getElementById('uitslag').innerHTML=l.slice(0,6).map((s,i)=>`<div class="kaart ski-kaart"><h3><a href="${s.u}">${i+1}. ${s.n}</a></h3><div class="meta">taille ${s.t} mm</div></div>`).join('')||'<p>Geen ski gevonden met deze keuzes.</p>';}
document.querySelectorAll('.finder select').forEach(e=>e.onchange=upd);upd();
</script>
{% endblock %}
