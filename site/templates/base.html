<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>{{ titel }} | Skiinformatie</title>
<style>
:root{--blauw:#0b4f8a;--licht:#eaf2fa;--tekst:#1d2733;--grijs:#6b7785;--rand:#dde4ec}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tekst);background:#f6f8fb;line-height:1.5}
.balk{background:#fff3cd;color:#664d03;text-align:center;font-size:13px;padding:6px}
header{background:var(--blauw);color:#fff;padding:14px 20px}header a{color:#fff;text-decoration:none;font-weight:700}
nav.kruim{font-size:13px;color:var(--grijs);margin-bottom:8px}nav.kruim a{color:var(--blauw)}
main{max-width:1050px;margin:0 auto;padding:24px 20px 60px}h1{font-size:30px;margin:4px 0 8px}h2{margin-top:36px}
a{color:var(--blauw)}.kaart{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ski-kaart h3{margin:0 0 4px;font-size:18px}.ski-kaart h3 a{text-decoration:none}.meta{color:var(--grijs);font-size:14px}
.as{display:grid;grid-template-columns:150px 1fr 26px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.bar{background:var(--licht);border-radius:4px;height:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blauw)}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14px}th,td{border-bottom:1px solid var(--rand);padding:8px;text-align:left}th{background:var(--licht)}
.knop{display:inline-block;background:#e8590c;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:600}.knop.uit{background:#adb5bd;cursor:default}
.finder{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}.finder label{font-size:13px;color:var(--grijs);display:flex;flex-direction:column;gap:4px}
select{padding:8px;border:1px solid var(--rand);border-radius:6px;font-size:15px}.tag{display:inline-block;background:var(--licht);border-radius:20px;padding:2px 10px;font-size:12px;margin-right:4px}
footer{font-size:13px;color:var(--grijs);text-align:center;padding:30px}
</style></head><body>
<div class="balk">Testversie – niet openbaar. Scores zijn concept (model v0.1).</div>
<header><a href="{{ BASE }}/">Skiinformatie · Ski-test</a></header>
<main>{% block inhoud %}{% endblock %}</main>
<footer>Specs op basis van openbare productgegevens. Scores berekend met ons eigen model – <a href="{{ BASE }}/methode/">zo werkt het</a>.</footer>
</body></html>
